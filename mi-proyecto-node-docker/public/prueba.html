<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Test Portal Prácticas</title>
    <style>
        body { font-family: Arial; padding: 20px; background-color: #222; color: white; }
        .caja { background: #333; padding: 20px; border-radius: 8px; width: 300px; }
        input { width: 100%; margin-bottom: 10px; padding: 8px; box-sizing: border-box; }
        button { background: #ff6b6b; color: white; border: none; padding: 10px; width: 100%; cursor: pointer; }
        #consola { background: black; color: #0f0; padding: 10px; margin-top: 15px; font-family: monospace; font-size: 12px; }
    </style>
</head>
<body>

    <div class="caja">
        <h2>Postular a Práctica</h2>
        
        <label>ID del Estudiante:</label>
        <input type="number" id="id_estudiante" placeholder="Ej: 1">
        
        <label>ID de la Oferta:</label>
        <input type="number" id="id_oferta" placeholder="Ej: 101">
        
        <button onclick="enviarPostulacion()">Enviar Postulación</button>

        <div id="consola">Esperando acción...</div>
    </div>

    <script>
        async function enviarPostulacion() {
            const consola = document.getElementById('consola');
            const id_est = document.getElementById('id_estudiante').value;
            const id_ofer = document.getElementById('id_oferta').value;

            consola.innerText = "Cargando...";

            try {
                
                const respuesta = await fetch('/api/postulaciones/postular', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id_estudiante: id_est, id_oferta: id_ofer })
                });

                
                const datos = await respuesta.json();
                
    
                consola.innerText = JSON.stringify(datos, null, 2);

            } catch (error) {
                consola.innerText = "Error de conexión: " + error.message;
            }
        }
    </script>

</body>
</html>
