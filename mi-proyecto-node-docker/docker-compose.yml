services:
  app:
    build: .
    container_name: node_backend
    ports:
      - "4000:3000"
    environment:
      - DB_HOST=postgres_db
      - DB_PORT=5432
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_NAME=mydb
      # IA de convalidación (RS7). Crea un archivo .env junto a este docker-compose.yml con XAI_API_KEY=...
      - XAI_API_KEY=${XAI_API_KEY:-}
      - XAI_MODEL=${XAI_MODEL:-grok-4}
      - IA_BASE_URL=${IA_BASE_URL:-}
      - IA_AUTO_PROCESAR=${IA_AUTO_PROCESAR:-true}
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
      - IA_MAX_LLAMADAS_DIA=${IA_MAX_LLAMADAS_DIA:-150}
      - IA_NOTA_BAJA_MAXIMA=${IA_NOTA_BAJA_MAXIMA:-3}
      - IA_MAX_CRITERIOS_BAJOS=${IA_MAX_CRITERIOS_BAJOS:-2}
      - IA_TIMEOUT_MS=${IA_TIMEOUT_MS:-90000}
    depends_on:
      - postgres_db
    volumes:
      - ./:/app
      - /app/node_modules
      - ./uploads:/app/uploads
    command: >
      sh -c "until nc -z postgres_db 5432; do echo 'Esperando a la base de datos...'; sleep 1; done; npm run dev"

  postgres_db:
    image: postgres:15-alpine
    container_name: postgres_db
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=mydb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  frontend:
    build: ./frontend
    container_name: react_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - app

volumes:
  postgres_data:
